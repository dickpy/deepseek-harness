<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:">
    <title id="page-title"></title>
    <link rel="stylesheet" href="login.css">
  </head>
  <body>
    <main class="card" id="card">
      <span class="badge" id="internal-badge" hidden></span>

      <header class="brand">
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" id="brand-name"></span>
      </header>

      <h1 id="heading"></h1>
      <p id="description"></p>

      <form id="form" autocomplete="on">
        <div class="field" id="env-field">
          <label id="env-label" for="env"></label>
          <div class="control">
            <select id="env" name="env"></select>
          </div>
        </div>

        <div class="field">
          <label id="email-label" for="email"></label>
          <div class="control">
            <input id="email" name="email" type="email" autocomplete="username" spellcheck="false" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field">
          <label id="password-label" for="password"></label>
          <div class="control">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="reveal" id="reveal" aria-pressed="false">
              <svg class="eye eye-open" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"></path>
                <circle cx="12" cy="12" r="3.2"></circle>
              </svg>
              <svg class="eye eye-closed" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 5.5 20 18.5"></path>
                <path d="M9.6 6.1A9.9 9.9 0 0 1 12 5.8c6 0 9.5 6.2 9.5 6.2a17 17 0 0 1-3.3 3.9"></path>
                <path d="M6.4 8.1A17 17 0 0 0 2.5 12s3.5 6.2 9.5 6.2a9.7 9.7 0 0 0 3.4-.6"></path>
              </svg>
            </button>
          </div>
        </div>

        <p id="error" role="alert" hidden></p>

        <button id="submit" class="submit" type="submit">
          <span class="spinner" id="spinner" aria-hidden="true"></span>
          <span id="submit-label"></span>
        </button>
      </form>

      <p class="footer" id="footer"></p>
    </main>

    <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
    <script src="login.js"></script>
  </body>
</html>
